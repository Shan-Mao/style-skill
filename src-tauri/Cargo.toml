[package]
name = "style-skill"
version = "0.1.0"
description = "Style Skill — 从参考截图提取设计语言并生成 Agent Skill"
edition = "2021"

# 注意：本脚手架尚未编译验证（开发机缺少 Rust/MSVC 工具链）。
# 工具链就绪后：npm i -D @tauri-apps/cli@^2 && npx tauri dev

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 便携分发优先体积
opt-level = "s"
lto = true
